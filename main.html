<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Internship Form</h1>
      <form method="post">
        <div class="form">
          <div class="form-group">
            <label for="first-name-input">First Name</label>
            <input
              type="text"
              id="first-name-input"
              name="first-name-input"
              required
            /><br /><br />
          </div>

          <div class="form-group">
            <label for="last-name-input">Last Name</label>
            <input
              type="text"
              id="last-name-input"
              name="last-name-input"
              required
            /><br /><br />
          </div>

          <div class="form-group">
            <label for="email-input">Email Address</label>
            <input
              type="email"
              id="email-input"
              name="email-input"
              required
              placeholder="xyz@abc.com"
            /><br /><br />
          </div>

          <div class="form-group">
            <label for="college-input">College</label>
            <input
              type="text"
              id="college-input"
              name="college-input"
              required
            /><br /><br />
          </div>

          <div class="form-group">
            <label for="graduation_year">Graduation Year</label>
            <select id="graduation_year" name="graduation_year" required>
              <option value="">Choose...</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option></select
            ><br /><br />
          </div>

          <div class="form-group">
            <label for="roll-no-input">Roll Number</label>
            <input
              type="text"
              id="roll-no-input"
              name="roll-no-input"
              required
            /><br /><br />
          </div>
        </div>
		
			<input type="checkbox" id="conditions-checkbox" name="conditions-checkbox" required />
        <label for="terms">Agree to the terms and conditions</label><br /><br />

		
        
        <button type="submit">Submit Form</button>
      </form>
    </div>
  </body>
</html>
